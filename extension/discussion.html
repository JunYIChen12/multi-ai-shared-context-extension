<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>多模型协作工程壳</title>
    <link rel="stylesheet" href="discussion.css" />
  </head>
  <body>
    <header class="banner">
      <strong id="connection-status">未连接</strong>
      <span id="connection-detail">请从已登录的 ChatGPT 或 Gemini 标签页点击扩展连接。Grok 未接入。</span>
    </header>
    <main>
      <form id="ask">
        <label for="prompt">问题</label>
        <textarea id="prompt" name="prompt" rows="4" required placeholder="输入一次问题。连接后发送给已连接的 ChatGPT 和 Gemini 标签页。"></textarea>
        <fieldset>
          <legend>参与的来源</legend>
          <label><input type="checkbox" name="provider" value="chatgpt" checked /><span id="chatgpt-label"> ChatGPT（未接入）</span></label>
          <label><input type="checkbox" name="provider" value="grok" checked /> Grok（未接入）</label>
          <label><input type="checkbox" name="provider" value="gemini" checked /><span id="gemini-label"> Gemini（未接入）</span></label>
        </fieldset>
        <div class="actions">
          <button id="record-gap" type="submit">记录未接入尝试</button>
          <button id="run-mock" type="button">运行 MOCK 演示</button>
          <button id="cross" type="button">第二轮交叉讨论</button>
        </div>
      </form>
      <p id="summary" aria-live="polite"></p>
      <p id="error" role="alert"></p>
      <section id="transcript" aria-live="polite"></section>
      <section class="files">
        <h2>本地文件</h2>
        <p>导出的是浏览器下载的 Markdown 和 JSONL，不是 chrome.storage。刷新后内存会话会消失，可用 JSONL 恢复。恢复结果一律标成未验证导入。</p>
        <div class="actions">
          <button id="export-md" type="button">导出 Markdown</button>
          <button id="export-jsonl" type="button">导出 JSONL</button>
          <label class="file">
            从 JSONL 恢复
            <input id="import-jsonl" type="file" accept=".jsonl,.txt,application/jsonl,text/plain" />
          </label>
        </div>
      </section>
    </main>
    <script src="discussion.js"></script>
  </body>
</html>
