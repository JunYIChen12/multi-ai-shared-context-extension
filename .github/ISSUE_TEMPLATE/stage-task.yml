name: 工作包
description: 一单一事：一个 Issue 只做一件可验收的事（准则 2）
title: "工作包："
body:
  - type: input
    id: requirement
    attributes:
      label: 需求编号
      placeholder: AI-REQ-20261105-001
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 这一件事
      description: 一句话写可观察的结果。发现别的问题另开 Issue 并互链，不在这里堆。不要把未接入或 MOCK 写成真实模型回复。
    validations:
      required: true
  - type: input
    id: assumption
    attributes:
      label: 依赖的假设 / 探针
      description: 关联已证实的探针 Issue，例如 #6。没有就写“无”；依赖未证实的假设时先开探针。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 前置依赖
      description: 分开写需要用户在场的登录、2FA、额度，以及可以自动跑的工程检查。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 写清技术验收和业务验收各看什么。
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: 停止条件
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 非目标
      description: 例如不接另外两家、不接 MCP、不导出 Cookie、不自动搬运 Drive。
    validations:
      required: true
