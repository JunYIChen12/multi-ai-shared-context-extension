name: 缺陷
description: 报告实际错误，并按原因回到对应阶段（准则 5）
title: "缺陷："
body:
  - type: textarea
    id: fact
    attributes:
      label: 实际现象
      description: 写命令、文件和输出。不要把单元测试或 MOCK 描述成三家网页实测。
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 预期
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 出现问题的提交 SHA
      description: 可以写 CI 摘要里的产物指纹，便于确认是不是同一个构建。
    validations:
      required: true
  - type: dropdown
    id: cause
    attributes:
      label: 初步原因归类
      description: 决定回到哪个阶段。拿不准选“待判定”，由架构评审定类后写决定记录。
      options:
        - 待判定
        - 需求：目标或验收不清
        - 可行性：关键假设未证实或被否定
        - 架构：契约或设计问题
        - 开发：实现偏离契约
        - 环境：浏览器、构建或依赖环境
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: 关联 Issue
      placeholder: "#2"
    validations:
      required: false
